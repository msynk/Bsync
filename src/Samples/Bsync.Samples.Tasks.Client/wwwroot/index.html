<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bsync Tasks</title>
    <base href="/" />
    <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1rem; }
        .rejected { color: #a4262c; }
    </style>
</head>
<body>
    <div id="app">Loading…</div>
    <script>
        // Saves an attachment's bytes as a file (the app passes a .NET stream).
        window.bsyncSaveFile = async (name, type, stream) => {
            const url = URL.createObjectURL(new Blob([await stream.arrayBuffer()], { type }));
            const link = Object.assign(document.createElement("a"), { href: url, download: name });
            link.click();
            URL.revokeObjectURL(url);
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
