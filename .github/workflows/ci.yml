# Build, test and pack on every push and pull request. Packages are uploaded as build artifacts only;
# publishing to a feed is a separate, explicitly authorized step (ADR-012) and is not part of this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit, conformance, process-kill and HTTP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The solution includes a Windows-only WPF sample; the test projects build everywhere.
      - run: dotnet build src/Bsync.slnx -c Release
        if: runner.os == 'Windows'
      - run: dotnet build src/Tests/Bsync.Tests -c Release
      - run: dotnet test src/Tests/Bsync.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}
          path: src/Tests/Bsync.Tests/TestResults

  postgres:
    name: PostgreSQL authority tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BSYNC_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test src/Tests/Bsync.Tests.PostgreSql -c Release --logger "trx;LogFileName=postgres.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-results
          path: src/Tests/Bsync.Tests.PostgreSql/TestResults

  sqlserver:
    name: SQL Server authority tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Bsync-Ci-Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Bsync-Ci-Passw0rd -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      BSYNC_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Bsync-Ci-Passw0rd;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test src/Tests/Bsync.Tests.SqlServer -c Release --logger "trx;LogFileName=sqlserver.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlserver-results
          path: src/Tests/Bsync.Tests.SqlServer/TestResults

  browser:
    name: Browser and WPF tests (Chromium, Firefox, WebKit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Tests/Bsync.Tests.Browser -c Release
      # The fixture installs the browsers itself; this also installs their system dependencies where needed.
      - run: pwsh src/Tests/Bsync.Tests.Browser/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit
      - run: dotnet test src/Tests/Bsync.Tests.Browser -c Release --no-build --logger "trx;LogFileName=browser.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: src/Tests/Bsync.Tests.Browser/TestResults

  pack:
    name: Pack (not published) and consume the packages
    runs-on: ubuntu-latest
    env:
      CI: true
      # A prerelease suffix per run, so the consumers below can never restore the published 0.x packages instead.
      BSYNC_PACKAGE_SUFFIX: ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >-
          for p in Bsync Bsync.Blazor Bsync.Server.AspNetCore Bsync.Server.PostgreSql Bsync.Server.SqlServer
          Bsync.Storage.Sqlite Bsync.Testing;
          do dotnet pack src/Bsync/$p -c Release -o artifacts/packages -p:VersionSuffix=$BSYNC_PACKAGE_SUFFIX || exit 1; done
      - name: Resolve the packed version
        run: echo "BSYNC_PACKAGE_VERSION=$(ls artifacts/packages/Bsync.Testing.*.nupkg | sed -E 's|.*/Bsync\.Testing\.(.*)\.nupkg|\1|')" >> "$GITHUB_ENV"
      # Only PackageReference from artifacts/packages (src/PackageConsumers/nuget.config maps Bsync.* to that feed).
      - name: Public conformance suites from the Bsync.Testing package
        run: dotnet test src/PackageConsumers/Bsync.PackageConsumer.Tests -c Release -p:BsyncPackageVersion=$BSYNC_PACKAGE_VERSION --logger "trx;LogFileName=package-consumer.trx"
      - name: ASP.NET Core host, browser assets and SQLite replica from the packages
        run: |
          dotnet publish src/PackageConsumers/Bsync.PackageConsumer.Web -c Release -p:BsyncPackageVersion=$BSYNC_PACKAGE_VERSION -o artifacts/consumer-web
          test -f artifacts/consumer-web/wwwroot/_content/Bsync.Blazor/bsync-indexeddb.js
          dotnet artifacts/consumer-web/Bsync.PackageConsumer.Web.dll --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-consumer-results
          path: src/PackageConsumers/Bsync.PackageConsumer.Tests/TestResults
