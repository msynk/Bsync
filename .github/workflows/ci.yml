# Build, test and pack on every push and pull request. Packages are uploaded as build artifacts only;
# publishing to a feed is a separate, explicitly authorized step (ADR-012) and is not part of this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-tooling:
    name: Release provenance failure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p "test_*.py" -v

  test:
    name: Unit, conformance, process-kill and HTTP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The solution includes a Windows-only WPF sample; the test projects build everywhere.
      - run: dotnet build src/Bsync.slnx -c Release
        if: runner.os == 'Windows'
      - run: dotnet build src/Tests/Bsync.Tests -c Release
      - run: dotnet test src/Tests/Bsync.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      # The encrypted SQLite store (SQLCipher) cannot share a process with the plain one: its own test project.
      - run: dotnet test src/Tests/Bsync.Tests.SqliteEncrypted -c Release --logger "trx;LogFileName=sqlite-encrypted.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}
          path: src/Tests/Bsync.Tests/TestResults

  postgres:
    name: PostgreSQL authority tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BSYNC_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test src/Tests/Bsync.Tests.PostgreSql -c Release --logger "trx;LogFileName=postgres.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-results
          path: src/Tests/Bsync.Tests.PostgreSql/TestResults

  sqlserver:
    name: SQL Server authority tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Bsync-Ci-Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Bsync-Ci-Passw0rd -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      BSYNC_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Bsync-Ci-Passw0rd;TrustServerCertificate=true
      BSYNC_S3: http://127.0.0.1:59000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # An S3-compatible server for the object storage test of the tasks sample (TasksSampleTests.AttachmentsInObjectStorage).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "moto[server]"
          nohup moto_server -H 127.0.0.1 -p 59000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:59000 > /dev/null && break; sleep 1; done
      - run: dotnet test src/Tests/Bsync.Tests.SqlServer -c Release --logger "trx;LogFileName=sqlserver.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlserver-results
          path: src/Tests/Bsync.Tests.SqlServer/TestResults

  browser:
    name: Browser and WPF tests (Chromium, Firefox, WebKit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Tests/Bsync.Tests.Browser -c Release
      # The tasks sample (TasksSampleTests) needs SQL Server: LocalDB where the runner image has it, else those tests skip.
      - shell: pwsh
        run: |
          if (Get-Command sqllocaldb -ErrorAction SilentlyContinue) {
            sqllocaldb start MSSQLLocalDB
            if ($LASTEXITCODE -eq 0) {
              "BSYNC_SQLSERVER=Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true" >> $env:GITHUB_ENV
              exit 0
            }
          }
          Write-Host "::notice::SQL Server LocalDB is not available; the tasks sample browser tests are skipped."
          exit 0
      # The fixture installs the browsers itself; this also installs their system dependencies where needed.
      - run: pwsh src/Tests/Bsync.Tests.Browser/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit
      - run: dotnet test src/Tests/Bsync.Tests.Browser -c Release --no-build --logger "trx;LogFileName=browser.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: src/Tests/Bsync.Tests.Browser/TestResults

  pack:
    name: Pack (not published) and consume the packages
    runs-on: ubuntu-latest
    env:
      CI: true
      # A prerelease suffix per run, so the consumers below can never restore the published 0.x packages instead.
      BSYNC_PACKAGE_SUFFIX: ci.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >-
          for p in Bsync Bsync.Blazor Bsync.Server.AspNetCore Bsync.Server.PostgreSql Bsync.Server.SqlServer Bsync.Storage.Sqlite;
          do dotnet pack src/Bsync/$p -c Release -o artifacts/packages -p:VersionSuffix=$BSYNC_PACKAGE_SUFFIX || exit 1; done
      - name: Resolve the packed version
        run: echo "BSYNC_PACKAGE_VERSION=$(ls artifacts/packages/Bsync.Storage.Sqlite.*.nupkg | sed -E 's|.*/Bsync\.Storage\.Sqlite\.(.*)\.nupkg|\1|')" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package identity and record provenance
        run: python scripts/release.py manifest --version "$BSYNC_PACKAGE_VERSION"
      - name: Verify distributed symbols and Source Link
        run: dotnet run --project src/Tools/Bsync.PackageVerifier -c Release -- artifacts/packages "$(git rev-parse HEAD)"
      - name: Reject mismatched and missing packaged symbols
        run: python scripts/verify_symbols_test.py artifacts/packages -v
      - name: Published 0.2.0 and candidate HTTP compatibility in separate processes
        run: python scripts/check_http_compatibility.py --version "$BSYNC_PACKAGE_VERSION" --packages artifacts/packages
      # Only PackageReference from artifacts/packages (src/Tests/PackageConsumers/nuget.config maps Bsync.* to that feed).
      - name: Public conformance suites from the Bsync package (namespace Bsync.Testing)
        run: dotnet test src/Tests/PackageConsumers/Bsync.PackageConsumer.Tests -c Release -p:BsyncPackageVersion=$BSYNC_PACKAGE_VERSION --logger "trx;LogFileName=package-consumer.trx"
      - name: ASP.NET Core host, browser assets and SQLite replica from the packages
        run: |
          dotnet publish src/Tests/PackageConsumers/Bsync.PackageConsumer.Web -c Release -p:BsyncPackageVersion=$BSYNC_PACKAGE_VERSION -o artifacts/consumer-web
          test -f artifacts/consumer-web/wwwroot/_content/Bsync.Blazor/bsync-indexeddb.js
          dotnet artifacts/consumer-web/Bsync.PackageConsumer.Web.dll --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-consumer-results
          path: |
            src/Tests/PackageConsumers/Bsync.PackageConsumer.Tests/TestResults
            artifacts/http-compatibility-*/*.log
            artifacts/http-compatibility-*/results.json

  package-browser:
    name: Packaged WebAssembly conformance (Chromium, Firefox, WebKit)
    needs: pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages
      - name: Resolve exact artifact version
        shell: pwsh
        run: |
          $version = (Get-Content artifacts/packages/provenance.json -Raw | ConvertFrom-Json).packageVersion
          "BSYNC_PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build browser test runner
        run: dotnet build src/Tests/Bsync.Tests.Browser -c Release
      - name: Publish package-only WebAssembly harness
        shell: pwsh
        run: dotnet publish src/Tests/PackageConsumers/Bsync.PackageConsumer.Browser -c Release "-p:BsyncPackageVersion=$env:BSYNC_PACKAGE_VERSION" -o artifacts/package-browser
      - run: pwsh src/Tests/Bsync.Tests.Browser/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit
      - name: Execute packaged client assets in all three engines
        shell: pwsh
        run: |
          $env:BSYNC_BROWSER_HOST = (Resolve-Path artifacts/package-browser/wwwroot).Path
          dotnet test src/Tests/Bsync.Tests.Browser -c Release --no-build --filter FullyQualifiedName~IndexedDbBrowserTests --logger "trx;LogFileName=package-browser.trx" --blame-hang-timeout 3m --blame-hang-dump-type none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-browser-results
          path: src/Tests/Bsync.Tests.Browser/TestResults
